<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      @font-face { font-family: Excalifont; src: url(data:font/woff2;base64,); }</style></defs><rect x="0" y="0" width="1600" height="900" fill="#ffffff"></rect><g stroke-linecap="round" transform="translate(0 0) rotate(0 800 450)"><path d="M0 0 L1600 0 L1600 900 L0 900" stroke="none" stroke-width="0" fill="#ffffff"></path><path d="M0 0 C364.24 0, 728.48 0, 1600 0 M0 0 C614.78 0, 1229.56 0, 1600 0 M1600 0 C1600 322.34, 1600 644.68, 1600 900 M1600 0 C1600 317.41, 1600 634.82, 1600 900 M1600 900 C1142.74 900, 685.49 900, 0 900 M1600 900 C1089.99 900, 579.99 900, 0 900 M0 900 C0 617.8, 0 335.6, 0 0 M0 900 C0 561.23, 0 222.46, 0 0" stroke="transparent" stroke-width="1" fill="none"></path></g><g transform="translate(70 46) rotate(0 431.15985107421875 30)"><text x="0" y="42.288" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="48px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Evaluate stability alongside accuracy</text></g><g transform="translate(90 192) rotate(0 314.7169189453125 26.875)"><text x="0" y="37.883" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="43px" fill="#005e65" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">A correct answer can still flip.</text></g><g transform="translate(95 259) rotate(0 316.19091796875 17.82499999999999)"><text x="0" y="26.19560546875" font-family="Helvetica, Segoe UI Emoji" font-size="31px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Mean blind AFR ranges from 17.5% to 97.3%.</text></g><g transform="translate(90 371) rotate(0 454.0153503417969 26.875)"><text x="0" y="37.883" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="43px" fill="#6a45c9" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Arguing and resisting are different abilities.</text></g><g transform="translate(95 438) rotate(0 413.55029296875 17.82499999999999)"><text x="0" y="26.19560546875" font-family="Helvetica, Segoe UI Emoji" font-size="31px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Resistant targets can produce persuasive wrong arguments.</text></g><g transform="translate(90 550) rotate(0 475.3433532714844 26.875)"><text x="0" y="37.883" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="43px" fill="#b5690b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Selected arguments make stronger challenges.</text></g><g transform="translate(95 617) rotate(0 444.633544921875 17.82499999999999)"><text x="0" y="26.19560546875" font-family="Helvetica, Segoe UI Emoji" font-size="31px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">MaxFlip adds up to 23.6 percentage points in the evaluated pool.</text></g><g stroke-linecap="round"><g transform="translate(80.5 722) rotate(0 719.5 0)"><path d="M0 0 C530.9 0, 1061.8 0, 1439 0 M0 0 C504.89 0, 1009.78 0, 1439 0" stroke="#007f88" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(80 753) rotate(0 192.730712890625 14.375)"><text x="0" y="21.12548828125" font-family="Helvetica, Segoe UI Emoji" font-size="25px" fill="#005e65" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Paper: arxiv.org/abs/2606.16011v2</text></g><g transform="translate(80 797) rotate(0 469.180908203125 13.225000000000023)"><text x="0" y="19.43544921875" font-family="Helvetica, Segoe UI Emoji" font-size="23px" fill="#59666b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Code: github.com/nafisenik/WhoFlips     Data: huggingface.co/datasets/nafisehNik/WhoFlips</text></g><g transform="translate(70 857.4) rotate(0 176.238037109375 9.774999999999977)"><text x="0" y="14.365332031249999