1249998" font-family="Helvetica, Segoe UI Emoji" font-size="33px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">MMLU multiple-choice questions</text></g><g transform="translate(440 247) rotate(0 214.62890625 15.525000000000006)"><text x="0" y="22.81552734375" font-family="Helvetica, Segoe UI Emoji" font-size="27px" fill="#59666b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Open-ended tasks remain untested.</text></g><g stroke-linecap="round"><g transform="translate(85.5 300) rotate(0 712 0)"><path d="M0 0 C489.41 0, 978.82 0, 1424 0 M0 0 C478.17 0, 956.33 0, 1424 0" stroke="#e9ecef" stroke-width="1" fill="none"></path></g></g><mask></mask><g transform="translate(85 328) rotate(0 80.27196502685547 18.125)"><text x="0" y="25.549" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="29px" fill="#005e65" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Interaction</text></g><g transform="translate(440 328) rotate(0 235.745361328125 18.974999999999994)"><text x="0" y="27.885644531249998" font-family="Helvetica, Segoe UI Emoji" font-size="33px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">One model-generated challenge</text></g><g transform="translate(440 380) rotate(0 370.6962890625 15.525000000000006)"><text x="0" y="22.81552734375" font-family="Helvetica, Segoe UI Emoji" font-size="27px" fill="#59666b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Human arguments and multi-turn exchanges remain untested.</text></g><g stroke-linecap="round"><g transform="translate(85.5 433) rotate(0 712 0)"><path d="M0 0 C438.86 0, 877.73 0, 1424 0 M0 0 C545.38 0, 1090.77 0, 1424 0" stroke="#e9ecef" stroke-width="1" fill="none"></path></g></g><mask></mask><g transform="translate(85 461) rotate(0 66.71448516845703 18.125)"><text x="0" y="25.549" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="29px" fill="#005e65" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Inference</text></g><g transform="translate(440 461) rotate(0 237.0263671875 18.974999999999994)"><text x="0" y="27.885644531249998" font-family="Helvetica, Segoe UI Emoji" font-size="33px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">The paper's fixed model settings</text></g><g transform="translate(440 513) rotate(0 361.74462890625 15.524999999999977)"><text x="0" y="22.81552734375" font-family="Helvetica, Segoe UI Emoji" font-size="27px" fill="#59666b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Reasoning-enabled behavior requires a separate evaluation.</text></g><g stroke-linecap="round"><g transform="translate(85.5 566) rotate(0 712 0)"><path d="M0 0 C297.88 0, 595.77 0, 1424 0 M0 0 C346.42 0, 692.85 0, 1424 0" stroke="#e9ecef" stroke-width="1" fill="none"></path></g></g><mask></mask><g transform="translate(85 594) rotate(0 88.21796417236328 18.125)"><text x="0" y="25.549" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="29px" fill="#005e65" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Intervention</text></g><g transform="translate(440 594) rotate(0 249.441650390625 18.975000000000023)"><text x="0" y="27.885644531249998" font-family="Helvetica, Segoe UI Emoji" font-size="33px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Measurement of answer instability</text></g><g transform="translate(440 646) rotate(0 219.131103515625 15.524999999999977)"><text x="0" y="22.81552734375" font-family="Helvetica, Segoe UI Emoji" font-size="27px" fill="#59666b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">The paper does not test a mitigation.</text></g><g stroke-linecap="round"><g transform="translate(70.5 770) rotate(0 729.5 0)"><path d="M0 0 C452.56 0, 905.12 0, 1459 0 M0 0 C442.89 0, 885.78 0, 1459 0" stroke="#007f88" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(70 786) rotate(0 499.5634765625 16.100000000000023)"><text x="0" y="23.660546874999998" font-family="Helvetica, Segoe UI Emoji" font-size="28px" fill="#005e65" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">The measured failure is real within this setting. Its reach is an empirical question.</text></g><g transform="translate(70 857.4) rotate(0 132.293701171875 9.774999999999977)"><text x="0" y="14.365332031249999" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#59666b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Experimental setup and Limitations</text></g><g transform="translate(1520 856.8) rotate(0 10.0107421875 10.350000000000023)"><text x="0" y="15.2103515625" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#adb5bd" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">17</text></g></svg>