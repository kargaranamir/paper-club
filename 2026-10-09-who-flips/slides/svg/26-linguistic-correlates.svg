<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      @font-face { font-family: Excalifont; src: url(data:font/woff2;base64,); }</style></defs><rect x="0" y="0" width="1600" height="900" fill="#ffffff"></rect><g stroke-linecap="round" transform="translate(0 0) rotate(0 800 450)"><path d="M0 0 L1600 0 L1600 900 L0 900" stroke="none" stroke-width="0" fill="#ffffff"></path><path d="M0 0 C364.24 0, 728.48 0, 1600 0 M0 0 C614.78 0, 1229.56 0, 1600 0 M1600 0 C1600 322.34, 1600 644.68, 1600 900 M1600 0 C1600 317.41, 1600 634.82, 1600 900 M1600 900 C1142.74 900, 685.49 900, 0 900 M1600 900 C1089.99 900, 579.99 900, 0 900 M0 900 C0 617.8, 0 335.6, 0 0 M0 900 C0 561.23, 0 222.46, 0 0" stroke="transparent" stroke-width="1" fill="none"></path></g><g transform="translate(70 46) rotate(0 591.6238403320312 30)"><text x="0" y="42.288" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="48px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Language differs between held and flipped answers</text></g><g transform="translate(72 108) rotate(0 402.47314453125 14.950000000000003)"><text x="0" y="21.9705078125" font-family="Helvetica, Segoe UI Emoji" font-size="26px" fill="#59666b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Descriptive associations from lexical features, not causal explanations</text></g><g transform="translate(72 14) rotate(0 80.6171875 9.774999999999999)"><text x="0" y="14.365332031249999" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#005e65" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">BACKUP / RESULTS</text></g><g stroke-linecap="round" transform="translate(70 185) rotate(0 350 240)"><path d="M32 0 C227.94 -1.43, 420.77 -3.17, 668 0 C692.2 0.46, 701.35 9.12, 700 32 C703.55 192.99, 703.6 352.27, 700 448 C701.89 466.11, 690.9 478.7, 668 480 C448.78 482.32, 228.65 482.97, 32 480 C11.03 483.38, 1.17 469.68, 0 448 C-2.67 341.75, -3.11 235.7, 0 32 C1.65 11.92, 11.53 0.72, 32 0" stroke="none" stroke-width="0" fill="#edf8f7"></path><path d="M32 0 C202.5 0.13, 372.38 0.45, 668 0 M32 0 C216.69 -2.25, 401.85 -2.12, 668 0 M668 0 C690.57 -0.46, 698.35 12.63, 700 32 M668 0 C687.11 1.62, 701.87 10.81, 700 32 M700 32 C700.25 171.74, 700.1 312.16, 700 448 M700 32 C698.33 120.76, 699.18 210.24, 700 448 M700 448 C700.05 467.58, 687.34 480.35, 668 480 M700 448 C698.02 469.39, 689.35 478.25, 668 480 M668 480 C485.87 478.37, 302.04 477.32, 32 480 M668 480 C488.5 481.24, 308.95 481.05, 32 480 M32 480 C11.1 479.94, 1.68 469.75, 0 448 M32 480 C12.4 480.13, -0.83 471.31, 0 448 M0 448 C-2.38 308.76, -1.11 168.63, 0 32 M0 448 C-0.57 307.37, -1.33 165.78, 0 32 M0 32 C1.26 9.58, 10.18 1.72, 32 0 M0 32 C0.69 12.93, 11.14 0.68, 32 0" stroke="#007f88" stroke-width="2" fill="none"></path></g><g transform="translate(94 207) rotate(0 133.421875 18.400000000000006)"><text x="0" y="27.040625" font-family="Helvetica, Segoe UI Emoji" font-size="32px" fill="#005e65" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">After the challenge</text></g><g transform="translate(94 270) rotate(0 254.663330078125 116.72499999999997)"><text x="0" y="24.505566406249997" font-family="Helvetica, Segoe UI Emoji" font-size="29px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Held answers: more resistance phrases</text><text x="0" y="57.85556640624999" font-family="Helvetica, Segoe UI Emoji" font-size="29px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="91.20556640624999" font-family="Helvetica, Segoe UI Emoji" font-size="29px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Flipped answers: about 6x as many</text><text x="0" y="124.55556640624998" font-family="Helvetica, Segoe UI Emoji" font-size="29px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">capitulation markers</text><text x="0" y="157.90556640625" font-family="Helvetica, Segoe UI Emoji" font-size="29px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="191.25556640624995" font-family="Helvetica, Segoe UI Emoji" font-size="29px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Held responses are longer:</text><text x="0" y="224.60556640624998" font-family="Helvetica, Segoe UI Emoji" font-size="29px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">about 1,800 vs 1,150 characters.</text></g><g stroke-linecap="round" transform="translate(830 185) rotate(0 350 240)"><path d="M32 0 C246.3 2.15, 462.41 -0.11, 668 0 C690.16 0.56, 698.06 13.29, 700 32 C702.77 133.5, 700.59 236.24, 700 448 C702.52 472.26, 687.89 482.49, 668 480 C419.93 482.75, 169.8 481.27, 32 480 C7.74 477.21, 0.94 470.82, 0 448 C3.15 287.33, 4.34 124.27, 0 32 C-3.01 8.94, 8.65 0.47, 32 0" stroke="none" stroke-width="0" fill="#fdf0dc"></path><path d="M32 0 C250.89 0.68, 469.74 -0.62, 668 0 M32 0 C245.59 -2.11, 458.84 -2.27, 668 0 M668 0 C690.5 1.44, 700.35 11.25, 700 32 M668 0 C690.91 -0.51, 699.64 12.42, 700 32 M700 32 C702.63 121.71, 702.32 213.25, 700 448 M700 32 C699.2 157.66, 699.84 282.28, 700 448 M700 448 C701.24 468.02, 688.98 478.68, 668 480 M700 448 C702.09 470.7, 687.32 478.04, 668 480 M668 480 C537.38 477.86, 406.27 478.29, 32 480 M668 480 C468.6 477.42, 268.55 477.68, 32 480 M32 480 C12.3 480.49, -1.39 468.76, 0 448 M32 480 C8.89 479.68, 1.22 471.62, 0 448 M0 448 C-0.15 320.14, -0.78 193.22, 0 32 M0 448 C-0.8 289.44, -1.35 130.47, 0 32 M0 32 C-0.32 10.38, 8.8 0.59, 32 0 M0 32 C2.14 12.6, 8.98 -0.29, 32 0" stroke="#e8a33d" stroke-width="2" fill="none"></path></g><g transform="translate(854 207) rotate(0 146.7734375 18.400000000000006)"><text x="0" y="27.040625" font-family="Helvetica, Segoe UI Emoji" font-size="32px" fill="#b5690b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Before the challenge</text></g><g transform="translate(854 270) rotate(0 246.895751953125 108.67499999999998)"><text x="0" y="22.81552734375" font-family="Helvetica, Segoe UI Emoji" font-size="27px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Later flips associate with:</text><text x="0" y="53.865527343749996" font-family="Helvetica, Segoe UI Emoji" font-size="27px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="84.91552734375" font-family="Helvetica, Segoe UI Emoji" font-size="27px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">More baseline hedging</text><text x="0" y="115.96552734374998" font-family="Helvetica, Segoe UI Emoji" font-size="27px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Longer baseline responses</text><text x="0" y="147.01552734375" font-family="Helvetica, Segoe UI Emoji" font-size="27px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="178.06552734375" font-family="Helvetica, Segoe UI Emoji" font-size="27px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Higher confidence in the wrong argument</text><text x="0" y="209.11552734375" font-family="Helvetica, Segoe UI Emoji" font-size="27px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">does not straightforwardly predict flips.</text></g><g transform="translate(80 703) rotate(0 351.556396484375 14.375)"><text x="0" y="21.12548828125" font-family="Helvetica, Segoe UI Emoji" font-size="25px" fill="#59666b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Manually curated lexicons; case-insensitive substring matching.</text></g><g stroke-linecap="round"><g transform="translate(70.5 770) rotate(0 729.5 0)"><path d="M0 0 C449.65 0, 899.3 0, 1459 0 M0 0 C558.79 0, 1117.57 0, 1459 0" stroke="#007f88" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(70 786) rotate(0 539.30078125 16.100000000000023)"><text x="0" y="23.660546874999998" font-family="Helvetica, Segoe UI Emoji" font-size="28px" fill="#005e65" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Response markers partly describe the outcome; they do not establish why it happened.</text></g><g transform="translate(70 857.4) rotate(0 100.64697265625 9.774999999999977)"><text x="0" y="14.365332031249999" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#59666b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">§5.4; Figure 2; Appendix B</text></g><g transform="translate(1520 856.8) rotate(0 10.0107421875 10.350000000000023)"><text x="0" y="15.2103515625" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#adb5bd" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">26</text></g></svg>