="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Table 7 shares sum to 96.1%.</text></g><g transform="translate(1004 553) rotate(0 240.779296875 13.800000000000011)"><text x="0" y="20.280468749999997" font-family="Helvetica, Segoe UI Emoji" font-size="24px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Do not normalize or invent the missing share.</text></g><g stroke-linecap="round" transform="translate(70 622) rotate(0 730 54)"><path d="M0 0 L1460 0 L1460 108 L0 108" stroke="none" stroke-width="0" fill="#f8f9fa"></path><path d="M0 0 C489.73 0, 979.47 0, 1460 0 M0 0 C465.19 0, 930.39 0, 1460 0 M1460 0 C1460 37.76, 1460 75.52, 1460 108 M1460 0 C1460 31.04, 1460 62.09, 1460 108 M1460 108 C1025.28 108, 590.57 108, 0 108 M1460 108 C918.01 108, 376.01 108, 0 108 M0 108 C0 65.99, 0 23.97, 0 0 M0 108 C0 73.89, 0 39.78, 0 0" stroke="transparent" stroke-width="1" fill="none"></path></g><g transform="translate(84 661) rotate(0 102.0234375 13.800000000000011)"><text x="0" y="20.280468749999997" font-family="Helvetica, Segoe UI Emoji" font-size="24px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Cross-matrix range</text></g><g transform="translate(384 661) rotate(0 250.1484375 13.800000000000011)"><text x="0" y="20.280468749999997" font-family="Helvetica, Segoe UI Emoji" font-size="24px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Figure 4 has 57–94% for the Llama-70B target.</text></g><g transform="translate(1004 661) rotate(0 243.4453125 13.800000000000011)"><text x="0" y="20.280468749999997" font-family="Helvetica, Segoe UI Emoji" font-size="24px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Prose claims column ranges of at most 10 pp.</text></g><g stroke-linecap="round"><g transform="translate(70.5 730) rotate(0 729.5 0)"><path d="M0 0 C431.45 0, 862.9 0, 1459 0 M0 0 C567.13 0, 1134.25 0, 1459 0" stroke="#adb5bd" stroke-width="1" fill="none"></path></g></g><mask></mask><g stroke-linecap="round"><g transform="translate(70.5 770) rotate(0 729.5 0)"><path d="M0 0 C468.29 0, 936.58 0, 1459 0 M0 0 C297.31 0, 594.63 0, 1459 0" stroke="#007f88" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(70 786) rotate(0 547.0390625 16.100000000000023)"><text x="0" y="23.660546874999998" font-family="Helvetica, Segoe UI Emoji" font-size="28px" fill="#005e65" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">These checks qualify particular summaries; they do not erase the observed answer flips.</text></g><g transform="translate(70 857.4) rotate(0 213.558349609375 9.774999999999977)"><text x="0" y="14.365332031249999" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#59666b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Tables 2, 5, 7; Figure 4; full audit in references/digest.md</text></g><g transform="translate(1520 856.8) rotate(0 10.0107421875 10.350000000000023)"><text x="0" y="15.2103515625" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#adb5bd" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">28</text></g></svg>