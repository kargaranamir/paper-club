70 786) rotate(0 477.8388671875 16.100000000000023)"><text x="0" y="23.660546874999998" font-family="Helvetica, Segoe UI Emoji" font-size="28px" fill="#005e65" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Blind vs self changes attribution while keeping the underlying argument fixed.</text></g><g transform="translate(70 857.4) rotate(0 57.653076171875 9.774999999999977)"><text x="0" y="14.365332031249999" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#59666b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">§3; Appendix A</text></g><g transform="translate(1520 856.8) rotate(0 10.0107421875 10.350000000000023)"><text x="0" y="15.2103515625" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#adb5bd" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">22</text></g></svg>