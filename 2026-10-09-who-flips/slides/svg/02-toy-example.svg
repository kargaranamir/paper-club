3125" font-family="Helvetica, Segoe UI Emoji" font-size="36px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">What is the probability of heads next?</text></g><g transform="translate(80 288) rotate(0 217.8681640625 16.099999999999994)"><text x="0" y="23.660546874999998" font-family="Helvetica, Segoe UI Emoji" font-size="28px" fill="#59666b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">A  1/6       B  1/2       C  5/6       D  1</text></g><g stroke-linecap="round" transform="translate(80 385) rotate(0 220 57.5)"><path d="M28.75 0 C129.64 1.34, 229.37 2.52, 411.25 0 C431.92 2.92, 436.76 6.02, 440 28.75 C438 42.47, 440.15 56.65, 440 86.25 C442.31 106.29, 432.38 116.23, 411.25 115 C319.41 109.45, 226.51 111.16, 28.75 115 C7.75 114.27, 3.41 104.13, 0 86.25 C-2.34 77.62, 1.26 58.95, 0 28.75 C-1.46 8.85, 6.12 -1.85, 28.75 0" stroke="none" stroke-width="0" fill="#d9f5dc"></path><path d="M28.75 0 C150.11 -0.98, 271.91 -1.32, 411.25 0 M28.75 0 C151 -0.03, 273.54 -0.52, 411.25 0 M411.25 0 C428.94 -1.86, 439.68 9.3, 440 28.75 M411.25 0 C430.73 -1.33, 438.85 9.27, 440 28.75 M440 28.75 C440.6 51.72, 441.46 74.69, 440 86.25 M440 28.75 C439.28 44.11, 439.92 59.96, 440 86.25 M440 86.25 C440.85 105.29, 429.52 116.9, 411.25 115 M440 86.25 C439.2 103.28, 429.08 113.11, 411.25 115 M411.25 115 C270.2 113.87, 131 113.78, 28.75 115 M411.25 115 C320.29 114.13, 230.24 113.49, 28.75 115 M28.75 115 C8.15 115.3, 0.96 105.17, 0 86.25 M28.75 115 C8.97 114.83, 2.07 104.53, 0 86.25 M0 86.25 C0.87 71.9, -1.79 56.84, 0 28.75 M0 86.25 C-1.2 72.31, 0.31 58.62, 0 28.75 M0 28.75 C1.54 7.7, 9.51 -0.36, 28.75 0 M0 28.75 C-1.41 10.09, 11.68 1.56, 28.75 0" stroke="#5cbf6a" stroke-width="2" fill="none"></path></g><g transform="translate(142.5 420.6) rotate(0 157.5341796875 20.125)"><text x="0" y="29.57568359375" font-family="Helvetica, Segoe UI Emoji" font-size="35px" fill="#2f8a3d" text-anchor="start"